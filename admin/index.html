<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · BOOLEEAN</title><meta name="robots" content="noindex,nofollow">

<style>
:root{--y:#E6FF00;--b:#1F3BFF;--k:#0a0a0a;--c:#FFF8E7;--g:#37d67a;--r:#ff3b30}
*{box-sizing:border-box;margin:0}body{font:400 15px/1.5 'Space Grotesk',sans-serif;background:var(--c);color:var(--k)}
h1,h2,h3{font-family:'Bowlby One',sans-serif;font-weight:400;line-height:1.1}h1{font-size:30px;margin-bottom:14px}h2{font-size:19px;margin:22px 0 8px}
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}nav{background:var(--k);padding:14px 10px;position:sticky;top:0;height:100vh}
nav .lg{font:20px 'Bowlby One';color:var(--y);padding:6px 10px 16px;display:block}nav a{display:block;color:#fff;text-decoration:none;padding:8px 10px;border-radius:10px;font-weight:700}nav a.on{background:var(--y);color:var(--k)}
#main{padding:22px;min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card,.box{background:#fff;border:3px solid var(--k);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--k)}.card small{display:block;font-weight:700}.card b{font:26px 'Bowlby One'}

.tw{overflow-x:auto;background:#fff;border:3px solid var(--k);border-radius:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:2px dashed #ccc;text-align:left;vertical-align:top}th{background:var(--y);white-space:nowrap}
tr.lk{cursor:pointer}tr.lk:hover{background:#f6ffb0}small{color:#555}
.pill{display:inline-block;border:2px solid var(--k);border-radius:99px;padding:0 9px;font-size:12px;font-weight:700;background:#eee;white-space:nowrap}
.pill.paid,.pill.delivered,.pill.completed,.pill.processed,.pill.sent,.pill.approved,.pill.captured{background:var(--g)}.pill.pending,.pill.new,.pill.processing,.pill.requested,.pill.queued{background:var(--y)}
.pill.failed,.pill.cancelled,.pill.rejected{background:#ff8a80}.pill.shipped{background:#9fb4ff}
input,select,textarea{font:inherit;border:3px solid var(--k);border-radius:10px;padding:7px 10px;background:#fff;max-width:100%}textarea{width:100%}label{display:block;font-weight:700;margin:8px 0 2px}
.btn{border:3px solid var(--k);background:var(--y);border-radius:99px;padding:7px 16px;font:700 14px 'Space Grotesk';cursor:pointer;box-shadow:3px 3px 0 var(--k);text-decoration:none;color:var(--k);display:inline-block}.btn.b{background:var(--b);color:#fff}.btn.r{background:#ff8a80}.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:220px}.err{background:#ff8a80;border:3px solid var(--k);border-radius:12px;padding:8px 12px;margin:10px 0}.ok{background:var(--g);border:3px solid var(--k);border-radius:12px;padding:8px 12px;margin:10px 0}
.ck{display:flex;gap:8px;align-items:flex-start;padding:4px 0}.ck input{width:20px;height:20px;margin-top:2px}.kv{display:grid;grid-template-columns:140px 1fr;gap:2px 10px}.kv span:nth-child(odd){font-weight:700}
.rv{background:#fff;border:3px solid var(--k);border-radius:14px;padding:12px 14px;margin-bottom:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .btn.on{background:var(--b);color:#fff}
#login,#denied{max-width:420px;margin:12vh auto;padding:0 18px;text-align:center}#login input{width:100%;margin:4px 0 8px}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}nav .lg{width:100%}.kv{grid-template-columns:1fr}}
</style></head><body>
<div id="login" hidden><h1>BOOLEEAN admin</h1><p style="margin:10px 0 16px">Owner access only.</p><button class="btn b" id="gg">Continue with Google</button><p style="margin:14px 0 6px"><small>or email + password</small></p><input id="e" type="email" placeholder="Email" autocomplete="email"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="pw">Sign in</button><p id="lm" class="err" hidden></p></div>

<div id="app" hidden><nav><a class="lg" href="#overview">BOOLEEAN</a><a data-p="overview" href="#overview">Overview</a><a data-p="orders" href="#orders">Orders</a><a data-p="payments" href="#payments">Payments</a><a data-p="shipping" href="#shipping">Shipping</a><a data-p="digital" href="#digital">Digital Deliveries</a><a data-p="refunds" href="#refunds">Refunds</a><a data-p="reviews" href="#reviews">Reviews</a><a data-p="emails" href="#emails">Email Logs</a><a data-p="settings" href="#settings">Settings</a></nav><main id="main"></main></div>

<script>
const C={URL:"https://ttaqayskweukbkvxoqds.supabase.co",KEY:"sb_publishable_UEfCsepDNdjpgx5TDd-9ew_soricS9Y"}; /* public key only. Access is enforced by database rules (RLS), not by this page. */
const sb=supabase.createClient(C.URL,C.KEY),$=s=>document.querySelector(s);

const pill=t=>`<span class="pill ${esc(t)}">${esc(t)}</span>`,q=async p=>{const{data,error}=await p;if(error)throw error;return data};

async function boot(){const{data}=await sb.auth.getSession();me=data.session&&data.session.user;if(!me)return show("login");
 const{data:ok}=await sb.rpc("is_admin");if(!ok)return show("denied");show("app");route()}

/* ---------- tables ---------- */
const typ=o=>o.requires_shipping&&o.has_digital?"mixed":o.requires_shipping?"physical":"digital";
function ordersTable(rows){return`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Product</th><th>Qty</th><th>Type</th><th>Price</th><th>Ship</th><th>Total</th><th>Payment</th><th>Fulfilment</th><th>Date</th></tr>${rows.map(o=>{const it=o.order_items||[];return`<tr class="lk" data-o="${o.id}"><td><b>${esc(o.order_number)}</b></td><td>${esc(o.customer_name)}<br><small>${esc(o.customer_email)}</small></td><td>${esc(o.customer_phone)}</td><td>${it.map(i=>esc(i.product_name)).join("<br>")}</td><td>${it.reduce((s,i)=>s+i.quantity,0)}</td><td>${typ(o)}</td><td>${rs(o.subtotal_paise)}</td><td>${rs(o.shipping_paise)}</td><td><b>${rs(o.total_paise)}</b></td><td>${pill(o.payment_status)}${o.refund_status!=="none"?" "+pill("refund "+o.refund_status):""}</td><td>${pill(o.fulfilment_status)}</td><td>${dt(o.created_at)}</td></tr>`}).join("")||'<tr><td colspan="12">Nothing here yet.</td></tr>'}</table></div>`}
document.addEventListener("click",e=>{const r=e.target.closest("[data-o]");if(r&&!e.target.closest("a,button"))location.hash="order/"+r.dataset.o});

const ordLink=o=>o?`<a href="#order/${o.id}">${esc(o.order_number)}</a>`:"–";
const ORD="*,order_items(*)";

/* ---------- views ---------- */
async function overview(){const[o,rv]=await Promise.all([q(sb.from("orders").select(ORD).order("created_at",{ascending:false}).limit(1000)),q(sb.from("reviews").select("status"))]);
 const paid=o.filter(x=>x.payment_status==="paid"),n=(a,f)=>a.filter(f).length;
 const cards=[["Total orders",o.length],["Successful payments",paid.length],["Revenue (net of refunds)",rs(paid.reduce((s,x)=>s+x.total_paise-x.amount_refunded_paise,0))],["Pending payments",n(o,x=>x.payment_status==="pending")],["Awaiting fulfilment",n(paid,x=>["new","processing"].includes(x.fulfilment_status))],["Delivered / completed",n(paid,x=>["delivered","completed"].includes(x.fulfilment_status))],["Refunds pending",n(o,x=>["requested","pending"].includes(x.refund_status))],["Total reviews",rv.length],["Reviews to approve",n(rv,x=>x.status==="pending")]];
 $("#main").innerHTML=`<h1>Overview</h1><div class="cards">${cards.map(c=>`<div class="card"><small>${c[0]}</small><b>${c[1]}</b></div>`).join("")}</div><h2>Recent orders</h2>${ordersTable(o.slice(0,10))}`}

let OF="all",OQ="";const F={all:()=>1,new:o=>o.payment_status==="paid"&&o.fulfilment_status==="new",paid:o=>o.payment_status==="paid",pending:o=>o.payment_status==="pending",failed:o=>o.payment_status==="failed",processing:o=>o.fulfilment_status==="processing",shipped:o=>o.fulfilment_status==="shipped",delivered:o=>o.fulfilment_status==="delivered",completed:o=>o.fulfilment_status==="completed",refund_pending:o=>["requested","pending"].includes(o.refund_status),refunded:o=>o.refund_status==="processed"};
async function orders(){const all=await q(sb.from("orders").select(ORD).order("created_at",{ascending:false}).limit(1000));
 const draw=()=>{const s=OQ.toLowerCase();$("#ot").innerHTML=ordersTable(all.filter(F[OF]).filter(o=>!s||[o.order_number,o.customer_name,o.customer_email,o.customer_phone,o.razorpay_payment_id,o.razorpay_order_id].join(" ").toLowerCase().includes(s)))};
 $("#main").innerHTML=`<h1>Orders</h1><div class="bar"><input id="sq" placeholder="Search order no., name, email, phone, Razorpay ID" value="${esc(OQ)}"><select id="sf">${Object.keys(F).map(k=>`<option value="${k}"${k===OF?" selected":""}>${k.replace("_"," ")}</option>`).join("")}</select></div><div id="ot"></div>`;
 $("#sq").oninput=e=>{OQ=e.target.value;draw()};$("#sf").onchange=e=>{OF=e.target.value;draw()};draw()}

async function order(id){const o=await q(sb.from("orders").select("*,order_items(*),order_addresses(*),payments(*),refunds(*),order_checklist_items(*),order_notes(*),order_events(*),shipments(*),digital_deliveries(*)").eq("id",id).single());
 const sh=[].concat(o.shipments||[])[0]||{},ad=(o.order_addresses||[]).find(a=>a.kind==="shipping"),by=(a,k)=>[...(a||[])].sort((x,y)=>(x[k]>y[k]?1:-1)),paid=o.payment_status==="paid";
 const cl=by(o.order_checklist_items,"sort_order"),v=x=>esc(x??"");
 $("#main").innerHTML=`<p><a href="#orders">← All orders</a></p><h1>${esc(o.order_number)}</h1><p>${pill(o.payment_status)} ${pill(o.fulfilment_status)} ${o.refund_status!=="none"?pill("refund "+o.refund_status):""} · ${typ(o)} · ${dt(o.created_at)}</p><p id="fm" hidden></p>
<div class="grid2"><div class="box"><h3>Customer &amp; shipping details</h3><div class="kv"><span>Name</span><span>${v(o.customer_name)}</span><span>Email</span><span>${v(o.customer_email)}</span><span>Phone</span><span>${v(o.customer_phone)}</span>${ad?`<span>Address</span><span>${v(ad.line1)}, ${v(ad.line2)}<br>${v(ad.city)}, ${v(ad.state)} ${v(ad.pincode)}${ad.landmark?`<br>Landmark: ${v(ad.landmark)}`:""}</span>`:"<span>Address</span><span>Not needed (digital)</span>"}</div></div>
<div class="box"><h3>Payment</h3><div class="kv"><span>Items</span><span>${rs(o.subtotal_paise)}</span><span>Shipping</span><span>${rs(o.shipping_paise)}</span><span>Total</span><span><b>${rs(o.total_paise)}</b></span><span>Refunded</span><span>${rs(o.amount_refunded_paise)}</span><span>Paid at</span><span>${dt(o.paid_at)}</span><span>Razorpay payment</span><span>${rz(o.razorpay_payment_id)}</span><span>Razorpay order</span><span>${v(o.razorpay_order_id)||"–"}</span></div></div></div>
<div class="box"><h3>Items</h3>${list([["Product",i=>esc(i.product_name)],["Type",i=>i.product_type],["Qty",i=>i.quantity],["Price",i=>rs(i.unit_price_paise)],["Personalisation",i=>(i.personalisation||[]).map(esc).join("<br>")||"–"]],o.order_items||[])}</div>
<div class="grid2"><div class="box"><h3>Checklist</h3>${cl.map(c=>`<label class="ck"><input type="checkbox" data-c="${c.id}"${c.checked?" checked":""}><span>${esc(c.label)}${c.checked_at?`<br><small>${dt(c.checked_at)}${c.checked_by?" · by admin":" · automatic"}</small>`:""}</span></label>`).join("")}
<label>Fulfilment status</label><select id="fs">${["new","processing","shipped","delivered","completed","cancelled"].map(s=>`<option${s===o.fulfilment_status?" selected":""}>${s}</option>`).join("")}</select>${paid?"":"<br><small>Can only move past “new” after payment is verified.</small>"}</div>
<div class="box"><h3>Internal notes</h3><textarea id="nt" rows="3" placeholder="Private note"></textarea><button class="btn" id="na">Add note</button>${by(o.order_notes,"created_at").reverse().map(n=>`<p style="margin-top:8px">${esc(n.note)}<br><small>${dt(n.created_at)}</small></p>`).join("")}</div></div>
${o.requires_shipping?`<div class="box"><h3>Shipping</h3><div class="grid2"><div><label>Courier</label><input id="sc" value="${v(sh.courier_name)}"><label>Shipment ID</label><input id="ss" value="${v(sh.shipment_ref)}"><label>AWB / tracking no.</label><input id="sa" value="${v(sh.awb_number)}"><label>Tracking URL</label><input id="su" style="width:100%" placeholder="https://" value="${v(sh.tracking_url)}"></div><div><label>Shipping date</label><input id="sd" type="date" value="${sh.shipped_at?sh.shipped_at.slice(0,10):""}"><label>Estimated delivery</label><input id="se" type="date" value="${v(sh.estimated_delivery)}"><label>Delivery status</label><select id="sx">${["not_shipped","packed","pickup_scheduled","in_transit","out_for_delivery","delivered","failed","returned"].map(s=>`<option${s===(sh.delivery_status||"not_shipped")?" selected":""}>${s}</option>`).join("")}</select></div></div><p style="margin-top:10px"><button class="btn b" id="sv">Save shipping</button> ${/^https?:\/\//i.test(sh.tracking_url||"")?`<a class="btn" target="_blank" rel="noopener" href="${esc(sh.tracking_url)}">Open tracking</a>`:""}</p></div>`:""}
${o.has_digital?`<div class="box"><h3>Digital delivery</h3>${(o.digital_deliveries||[]).map(d=>`<p>${pill(d.status)} sent ${dt(d.sent_at)}${d.last_error?` · ${esc(d.last_error)}`:""}</p>`).join("")||"<p>Not sent yet.</p>"}<button class="btn" disabled>Send digital product (needs email setup)</button></div>`:""}
<div class="box"><h3>Refunds</h3>${list([["Refund",r=>esc(r.razorpay_refund_id||"manual")],["Amount",r=>rs(r.amount_paise)],["Status",r=>pill(r.status)],["Date",r=>dt(r.processed_at||r.created_at)]],o.refunds||[])}<p style="margin-top:8px"><small>Issue refunds in the Razorpay Dashboard. Status updates here automatically.</small></p></div>
<div class="box"><h3>Activity</h3>${by(o.order_events,"created_at").reverse().map(e=>`<p>${dt(e.created_at)} · ${esc(e.description||e.event_type)} <small>(${esc(e.actor_label)})</small></p>`).join("")}</div>`;
 const again=()=>order(id);
 $("#fs").onchange=e=>act(()=>q(sb.from("orders").update({fulfilment_status:e.target.value}).eq("id",id)),again);
 document.querySelectorAll("[data-c]").forEach(b=>b.onchange=()=>act(()=>q(sb.from("order_checklist_items").update({checked:b.checked}).eq("id",b.dataset.c)),again));
 $("#na").onclick=()=>{const t=$("#nt").value.trim();if(t)act(()=>q(sb.from("order_notes").insert({order_id:id,note:t,created_by:me.id})),again)};
 if($("#sv"))$("#sv").onclick=()=>{const g=n=>$("#"+n).value.trim()||null;act(()=>q(sb.from("shipments").upsert({order_id:id,courier_name:g("sc"),shipment_ref:g("ss"),awb_number:g("sa"),tracking_url:g("su"),shipped_at:g("sd")?new Date(g("sd")).toISOString():null,estimated_delivery:g("se"),delivery_status:$("#sx").value},{onConflict:"order_id"})),async()=>{await again();msg("Saved.",1)})}}

async function payments(){const r=await q(sb.from("payments").select("*,orders(id,order_number,customer_name)").order("created_at",{ascending:false}).limit(300));
 $("#main").innerHTML="<h1>Payments</h1>"+list([["Order",x=>ordLink(x.orders)],["Customer",x=>esc(x.orders?.customer_name)],["Razorpay payment",x=>rz(x.razorpay_payment_id)],["Amount",x=>rs(x.amount_paise)],["Status",x=>pill(x.status)],["Method",x=>esc(x.method||"–")],["Signature checked",x=>x.signature_verified?"yes":"no"],["Error",x=>esc(x.error_description||"")],["Date",x=>dt(x.created_at)]],r)}
async function shipping(){const r=await q(sb.from("orders").select("id,order_number,customer_name,fulfilment_status,created_at,shipments(*)").eq("requires_shipping",true).eq("payment_status","paid").order("created_at",{ascending:false}));
 const s=o=>[].concat(o.shipments||[])[0]||{};$("#main").innerHTML="<h1>Shipping</h1>"+list([["Order",ordLink],["Customer",o=>esc(o.customer_name)],["Fulfilment",o=>pill(o.fulfilment_status)],["Courier",o=>esc(s(o).courier_name||"–")],["AWB",o=>esc(s(o).awb_number||"–")],["Delivery",o=>pill(s(o).delivery_status||"not_shipped")],["Tracking",o=>/^https?:\/\//i.test(s(o).tracking_url||"")?`<a target="_blank" rel="noopener" href="${esc(s(o).tracking_url)}">open</a>`:"–"]],r)}
async function digital(){const r=await q(sb.from("orders").select("id,order_number,customer_name,customer_email,fulfilment_status,order_items(product_name,product_type),digital_deliveries(status,sent_at,last_error)").eq("has_digital",true).eq("payment_status","paid").order("created_at",{ascending:false}));
 $("#main").innerHTML="<h1>Digital Deliveries</h1>"+list([["Order",ordLink],["Customer",o=>esc(o.customer_email)],["Digital items",o=>(o.order_items||[]).filter(i=>i.product_type==="digital").map(i=>esc(i.product_name)).join("<br>")],["Delivery",o=>(o.digital_deliveries||[]).map(d=>pill(d.status)).join(" ")||pill("pending")],["Last sent",o=>dt((o.digital_deliveries||[]).map(d=>d.sent_at).filter(Boolean).sort().pop())]],r)+"<p style='margin-top:10px'><small>Sending files by email is added with the email setup stage.</small></p>"}
async function refunds(){const r=await q(sb.from("refunds").select("*,orders(id,order_number,customer_name,customer_email,total_paise,amount_refunded_paise)").order("created_at",{ascending:false}));
 $("#main").innerHTML="<h1>Refunds</h1>"+list([["Order",x=>ordLink(x.orders)],["Customer",x=>esc(x.orders?.customer_name)+"<br><small>"+esc(x.orders?.customer_email)+"</small>"],["Razorpay payment",x=>rz(x.razorpay_payment_id)],["Paid",x=>rs(x.orders?.total_paise)],["Refund",x=>rs(x.amount_paise)],["Refunded so far",x=>rs(x.orders?.amount_refunded_paise)],["Status",x=>pill(x.status)],["Date",x=>dt(x.processed_at||x.created_at)],["Reason",x=>esc(x.reason||x.notes||"")]],r)+"<p style='margin-top:10px'><small>Start refunds in the Razorpay Dashboard. Status syncs from Razorpay’s webhook.</small></p>"}
let RT="pending";async function reviews(){const all=await q(sb.from("reviews").select("*,products(name)").order("created_at",{ascending:false}));
 const draw=()=>{$("#rl").innerHTML=all.filter(x=>x.status===RT).map(x=>`<div class="rv"><b>${"★".repeat(x.rating)}${"☆".repeat(5-x.rating)}</b> ${esc(x.display_name)} on ${esc(x.products?.name)} ${x.verified_purchase?pill("verified purchase"):"<small>(not a verified purchase)</small>"}<p style="margin:6px 0">“${esc(x.body)}”</p><small>${dt(x.created_at)}</small><p style="margin-top:8px">${x.status!=="approved"?`<button class="btn b" data-a="approved" data-i="${x.id}">Approve</button> `:""}${x.status!=="rejected"?`<button class="btn" data-a="rejected" data-i="${x.id}">Reject</button> `:""}<button class="btn r" data-a="delete" data-i="${x.id}">Delete</button></p></div>`).join("")||"<p>Nothing here.</p>"};
 $("#main").innerHTML=`<h1>Reviews</h1><p id="fm" hidden></p><div class="tabs">${["pending","approved","rejected"].map(t=>`<button class="btn${t===RT?" on":""}" data-t="${t}">${t} (${all.filter(x=>x.status===t).length})</button>`).join("")}</div><div id="rl"></div>`;draw();
 $("#main").onclick=e=>{const t=e.target.closest("[data-t]");if(t){RT=t.dataset.t;return reviews()}const b=e.target.closest("[data-a]");if(!b)return;
  if(b.dataset.a==="delete"){if(!confirm("Delete this review permanently?"))return;act(()=>q(sb.from("reviews").delete().eq("id",b.dataset.i)),reviews)}
  else act(()=>q(sb.from("reviews").update({status:b.dataset.a,moderated_by:me.id,moderated_at:new Date().toISOString()}).eq("id",b.dataset.i)),reviews)}}
async function emails(){const r=await q(sb.from("email_logs").select("*").order("created_at",{ascending:false}).limit(300));
 $("#main").innerHTML="<h1>Email Logs</h1>"+list([["Time",x=>dt(x.created_at)],["To",x=>esc(x.recipient)],["Type",x=>esc(x.audience+" · "+x.template)],["Status",x=>pill(x.status)],["Attempts",x=>x.attempts],["Error",x=>esc(x.error||"")]],r)+"<p style='margin-top:10px'><small>No emails are sent until the email setup stage is finished.</small></p>"}
async function settings(){const[s,w]=await Promise.all([q(sb.from("app_settings").select("*")),q(sb.from("webhook_events").select("event_type,status,error,received_at").order("received_at",{ascending:false}).limit(15))]);
 const em=(s.find(x=>x.key==="admin_notification_email")||{}).value||"";
 $("#main").innerHTML=`<h1>Settings</h1><p id="fm" hidden></p><div class="box"><h3>Order alert email</h3><input id="ae" type="email" value="${esc(em)}" style="width:min(380px,100%)"> <button class="btn b" id="as">Save</button></div><div class="box"><h3>Signed in</h3><p>${esc(me.email)}</p><button class="btn" id="so">Sign out</button></div><h2>Recent Razorpay webhook events</h2>${list([["Time",x=>dt(x.received_at)],["Event",x=>esc(x.event_type)],["Result",x=>pill(x.status)],["Note",x=>esc(x.error||"")]],w)}`;
 $("#as").onclick=()=>act(()=>q(sb.from("app_settings").update({value:$("#ae").value.trim(),updated_by:me.id}).eq("key","admin_notification_email")),async()=>msg("Saved.",1));
 $("#so").onclick=async()=>{await sb.auth.signOut()}}

const R={overview,orders,payments,shipping,digital,refunds,reviews,emails,settings};
async function route(){const[p,arg]=(location.hash.slice(1)||"overview").split("/");document.querySelectorAll("nav a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===(p==="order"?"orders":p)));
 $("#main").onclick=null;$("#main").innerHTML="<p>Loading…</p>";try{await(p==="order"?order(arg):(R[p]||overview)())}catch(e){$("#main").innerHTML=`<p class="err">${esc(e.message||e)}</p>`}}
addEventListener("hashchange",()=>{if(!$("#app").hidden)route()});boot();
</script></body></html>
